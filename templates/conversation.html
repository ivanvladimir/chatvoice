{% extends 'base.html' %}

{% block script %}
	<script type="text/javascript" charset="utf-8">
        $(document).ready(function(){
            namespace = '{{prefix}}';
            var msgCount = 1;
            var client_id = Date.now()
            var spk='USER';
            var port='{{port}}';
            //var converter = new showdown.Converter();
            if(port.length>0){
                var ws = new WebSocket('{{protocol}}://{{server}}:{{port}}' + namespace+`${client_id}`);
            }else{
                var ws = new WebSocket('{{protocol}}://{{server}}' + namespace+`${client_id}`);
            }
            $('#send').click(function(e) {
                var msg = String($('#msg').val());
                if(msg.trim().length>0){
                    ws.send(JSON.stringify({'cmd':'input completed','msg':msg,'client_id':client_id}));
                    $('#log').append('<br>' +msgCount + '. '+ spk+':'+msg);
                    $('#msg').val('');
                    $('#msg').focus();
                    $('#send').prop('disabled',true)
                    msgCount += 1;
      			        return false;
                }
    		    });

            $('#start').click(function(e) {
                   var preferences={};
                    {% for k,v in data.items() %}
                	    preferences["{{k}}"]="{{v}}";
                    {% endfor %}
                    ws.send(JSON.stringify({'cmd':'start','conversation':"{{chat_name}}",'data':preferences }));
                    return false;
                    $('#start').prop('disabled',true)
                    $('#msg').focus();
 
            });

            $('#msg_input').focus();

            function sleep(milliseconds) {
                  const date = Date.now();
                  let currentDate = null;
                  do {
                          currentDate = Date.now();
                        } while (currentDate - date < milliseconds);
            };

          ws.onmessage = function(event) {
				  data=JSON.parse(event.data);
	        var to_continue=true;
                // SAY
				  if(data.cmd=="say"){
                	$('#last_say').html(data.msg);
                    //let utter = new SpeechSynthesisUtterance();
                    //utter.lang = 'es-MX';
                    //utter.text = data.msg;
                    //utter.volume = 0.5;
                    // speak
                    //window.speechSynthesis.speak(utter);
                    $('#log').append('<br>' +msgCount + '. '+ data.spk+':'+data.msg);
					          console.log('say');
                	  msgCount += 1;
                    sleep(400);
				  };
			    if(data.cmd=="activate input"){
            $('#send').prop('disabled',false);
            spk=data.spk;
				    console.log('activate input');
            };
          	if(data.cmd=="finish"){
                    		document.getElementById('msg_input').disabled = true;
                    		document.getElementById('chat_window').disabled = true;
                    		document.getElementById('bye_message').removeAttribute('hidden');
                    		window.scrollTo(0, document.body.scrollHeight);
				    to_continue=false;
            };
          };


            ws.onclose = function(e) {
                    console.log('Socket is closed.');
     		    document.getElementById('msg_input').disabled = true;
                    document.getElementById('chat_window').disabled = true;
		    if(to_continue){
			console.log('Not finished normal. Reconnect will be attempted in 1 second.', e.reason);
                        if(port.length>0){
                                ws = new WebSocket('{{protocol}}://{{server}}:{{port}}' + namespace+`${client_id}`);
                            }else{
                                ws = new WebSocket('{{protocol}}://{{server}}' + namespace+`${client_id}`);
                            }
    				document.getElementById('msg_input').disabled = false;
                    		document.getElementById('chat_window').disabled = false;
		 
			}else{
				document.getElementById('close_message').removeAttribute('hidden');
                    		window.scrollTo(0, document.body.scrollHeight);
			}
                    };

            ws.onerror = function(err) {
                    console.log('Socket had an error.');
		    document.getElementById('msg_input').disabled = true;
                    document.getElementById('chat_window').disabled = true;
		    if(to_continue){
			console.log('Not finished normal. Reconnect will be attempted in 1 second.', e.reason);
                        if(port.length>0){
                                ws = new WebSocket('{{protocol}}://{{server}}:{{port}}' + namespace+`${client_id}`);
                            }else{
                                ws = new WebSocket('{{protocol}}://{{server}}' + namespace+`${client_id}`);
                        }
      		    document.getElementById('msg_input').disabled = false;
                    document.getElementById('chat_window').disabled = false;
		     	}else{
				document.getElementById('error_message').removeAttribute('hidden');
                    		window.scrollTo(0, document.body.scrollHeight);
			}
                    };
        });
    </script>
{% endblock %}

{% block content %}

	<div class="container">
	<center>
    <button id="start" class="primary">Start</button>
	</center>
	</div>

    <div class="container">

    <h3>Audio status</h3>
    <p><div id='audio'></div></p>

    <form action="">
        <div class="row">
              <div class="col-sm-12">
        <label id="last_say">Mensaje</label>
            </div>
            </div>
        <div class="row">
              <div class="col-sm-11">
        <input type="text" id="msg" autocomplete="off"  style="width:90%;"/>
                </div>
              <div class="col-sm-1">
        <button id="send" class="primary" disabled>Enviar</button>
                </div>
                </div>
    </form>
    <div class="row">
        <div class="card large">
        <h3>Messages received</h3>
        <div class="section dark">
        <div id='log'>
        </div>
        </div>
        </div>
    </div>
    </div>
{% endblock %}
