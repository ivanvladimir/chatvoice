<!DOCTYPE html>
<html lang="en" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My App{% endblock %}</title>

    <!-- Tailwind CSS + DaisyUI + Typography plugin -->
    <link rel="stylesheet" href="{{ url_for('static', path='output.css') }}" />

    <!-- HTMX -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>

    <!-- Hyperscript -->
    <script src="https://cdn.jsdelivr.net/npm/hyperscript.org@0.9.93/dist/_hyperscript.min.js"
      integrity="sha384-/6HsqTiz02YfFBUhzTwlH/yxe68DhfnkdHiWytM3nxAzs/yvG+3FZY0f4KLnNoov"
      crossorigin="anonymous"></script>

    <style>
        .prose {
            --tw-prose-body: oklch(var(--bc) / 0.8);
            --tw-prose-headings: oklch(var(--bc));
            --tw-prose-links: oklch(var(--p));
            --tw-prose-bold: oklch(var(--bc));
            --tw-prose-code: oklch(var(--p));
            --tw-prose-quotes: oklch(var(--bc) / 0.9);
            --tw-prose-quote-borders: oklch(var(--p) / 0.5);
            --tw-prose-hr: oklch(var(--bc) / 0.2);
        }

        .prose :where(code):not(:where(pre *)) {
            background: oklch(var(--b2));
            padding: 0.15em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }

        .prose pre {
            background: oklch(var(--b2));
            border: 1px solid oklch(var(--bc) / 0.1);
            border-radius: 0.75rem;
        }

        .prose pre code {
            background: transparent;
            padding: 0;
        }

        .prose blockquote {
            border-left-color: oklch(var(--p) / 0.5);
            background: oklch(var(--b2));
            padding: 0.75rem 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .prose table {
            width: 100%;
        }

        .prose thead {
            border-bottom-color: oklch(var(--bc) / 0.2);
        }

        .prose tbody tr {
            border-bottom-color: oklch(var(--bc) / 0.1);
        }

        .prose tbody tr:hover {
            background: oklch(var(--b2));
        }

        .prose a {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .prose a:hover {
            color: oklch(var(--pf));
        }

        .prose img {
            border-radius: 0.75rem;
            border: 1px solid oklch(var(--bc) / 0.1);
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="navbar bg-base-100 shadow-sm">
        <div class="navbar-start">
            <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"/>
                    </svg>
                </div>
                <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                </ul>
            </div>
            <a href="/" class="btn btn-ghost text-xl">MyApp</a>
        </div>

        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>

        <div class="navbar-end">
            {% block navbar_end %}
            <a href="/login" class="btn">Login</a>
            {% endblock %}
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-8">
        {% block public_content %}{% endblock %}
    </main>

    <!-- Toast Container for HTMX responses -->
    <div id="toast-container" class="toast toast-top toast-end z-50"></div>

    <!-- Footer -->
    {% include "footer.html" %}

    {% block scripts %}{% endblock %}
</body>
</html>
